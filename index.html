<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inflation Lens</title><style>:root{font-family:Inter,system-ui;color:#172033;background:#f5f1e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e8}main{width:min(94vw,1040px)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.kicker{color:#c2410c;font-weight:800}h1{font-size:clamp(2.5rem,7vw,5.5rem);letter-spacing:-.06em;line-height:.9;margin:.4rem 0}.card{background:#fff;border:1px solid #ded8cc;border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;color:#677087;font-size:.8rem;font-weight:700;margin-bottom:7px}.field input{width:100%;border:1px solid #d8d4cb;border-radius:12px;padding:14px;font:inherit;font-size:1.1rem}.chart{height:260px;display:flex;align-items:end;gap:clamp(30px,8vw,90px);justify-content:center;padding:30px 30px 0;margin-top:20px;border-bottom:1px solid #d8d4cb}.bar{width:110px;max-width:22%;height:var(--h);min-height:8px;border-radius:14px 14px 0 0;background:#172033;position:relative;transition:.3s}.bar:nth-child(2){background:#df6b35}.bar:nth-child(3){background:#f2b45f}.bar span{position:absolute;top:-28px;width:100%;text-align:center;font-weight:800}.bar small{position:absolute;bottom:-28px;width:100%;text-align:center;color:#677087}.rates{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:42px}.rate{padding:18px;border-radius:16px;background:#f5f1e8}.rate strong{display:block;font-size:2rem}.up{color:#c2410c}.down{color:#15803d}@media(max-width:650px){header{display:block}.grid{grid-template-columns:1fr}.chart{height:220px}.rates{grid-template-columns:1fr}}</style></head><body><main><header><div><div class="kicker">Price trend analyzer</div><h1>Inflation Lens</h1></div><p>Compare three annual prices and reveal the pace of change.</p></header><section class="card"><div class="grid"><div class="field"><label>Two years ago</label><input id="old" type="number" min=".01" step=".01" value="80"></div><div class="field"><label>One year ago</label><input id="mid" type="number" min=".01" step=".01" value="92"></div><div class="field"><label>Current price</label><input id="now" type="number" min=".01" step=".01" value="105"></div></div><div class="chart"><div class="bar" id="oldBar"><span id="oldVal"></span><small>2 years ago</small></div><div class="bar" id="midBar"><span id="midVal"></span><small>Last year</small></div><div class="bar" id="nowBar"><span id="nowVal"></span><small>Today</small></div></div><div class="rates"><div class="rate">Earlier annual change<strong id="rate1"></strong></div><div class="rate">Most recent change<strong id="rate2"></strong></div></div></section><script>const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function render(){const a=Math.max(.01,+old.value),b=Math.max(.01,+mid.value),c=Math.max(.01,+now.value),max=Math.max(a,b,c);[[oldBar,oldVal,a],[midBar,midVal,b],[nowBar,nowVal,c]].forEach(([bar,label,v])=>{bar.style.setProperty('--h',v/max*210+'px');label.textContent=money(v)});const set=(el,v)=>{el.textContent=(v>=0?'+':'')+v.toFixed(1)+'%';el.className=v>=0?'up':'down'};set(rate1,(b-a)/a*100);set(rate2,(c-b)/b*100)}document.querySelectorAll('input').forEach(i=>i.oninput=render);render()</script></section></main></body></html>
